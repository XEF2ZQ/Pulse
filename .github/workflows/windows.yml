name: Windows build and tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Configure x64 Release
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test native policies and defensive parsers
        run: ctest --test-dir build -C Release -L unit --output-on-failure
      - name: Test offline recovery and component evidence
        run: python -m unittest discover -s tools -p "test_*.py"
      - name: Reproduce published battery summaries
        run: python tools/verify_published_evidence.py
      - name: Upload unsigned engineering build and test log
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Pulse-windows-x64-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/Release/Pulse.exe
            build/Release/PulseTailProbe.exe
            build/Testing/Temporary/LastTest.log
            tools/TAIL_PROBE.md
            tools/analyze_tail.py
            tools/component_tail.py
            LICENSE
            NOTICE.md
